services:
  auto-oc-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto-oc-backend-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Jakarta
      - HEADLESS_MODE=True
      - DATA_PROVIDER_TYPE=hybrid
      - DATABASE_PATH=data/db/auto_oc.db
      - API_PORT=8000
      - API_SECRET_KEY=foodmaster-secret-api-key-2026
    volumes:
      # Persistent isolated Chromium browser profile & session login
      - ./chromeprofile:/app/chromeprofile
      # Persistent SQLite database backup and logs
      - ./data:/app/data
      # Config overrides
      - ./config:/app/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
