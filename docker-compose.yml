services:
  tuyulvb-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuyulvb-backend-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
      - HEADLESS_MODE=True
      - DATA_PROVIDER_TYPE=hybrid
      - DATABASE_PATH=data/db/tuyul_vb.db
    volumes:
      # Persistent isolated Chromium browser profile & session login
      - ./chromeprofile:/app/chromeprofile
      # Persistent SQLite database backup and logs
      - ./data:/app/data
      # Config overrides
      - ./config:/app/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
