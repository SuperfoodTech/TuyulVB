image: python:3.13

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

stages:
  - test

test:
  stage: test
  before_script:
    - python -V
    - pip install -r requirements.txt
    - |
      # Create .env file from GitLab CI/CD variables
      echo "MONDAY_API_KEY=$MONDAY_API_KEY" >> .env
      echo "GOOGLE_SHEET_NAME=$GOOGLE_SHEET_NAME" >> .env
      echo "GRAB_USERNAME=$GRAB_USERNAME" >> .env
      echo "GRAB_PASSWORD=$GRAB_PASSWORD" >> .env
      echo "SHOPEE_USERNAME=$SHOPEE_USERNAME" >> .env
      echo "SHOPEE_PASSWORD=$SHOPEE_PASSWORD" >> .env
      echo "$GOOGLE_CREDENTIALS_JSON" > credentials.py
  script:
    - pytest
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH